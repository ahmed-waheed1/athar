name: athar
description: "Athar - a bilingual habit tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  equatable: ^3.0.0
  go_router: ^18.1.0
  easy_localization: ^3.0.8
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  uuid: ^4.6.0
  characters: ^1.4.1
  flutter_svg: ^2.3.0
  flutter_slidable: ^4.0.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  hive_ce_generator: ^1.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/ui/
    - assets/icons/habit/
    - assets/illustrations/
    - assets/brand/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
