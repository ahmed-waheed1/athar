name: athar
description: "Athar - a bilingual habit tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  equatable: ^3.0.0
  go_router: ^18.1.0
  easy_localization: ^3.0.8
  flutter_screenutil: ^5.9.3
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  uuid: ^4.6.0
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  animations: ^3.0.0
  percent_indicator: ^4.2.5
  flutter_heatmap_calendar: ^1.0.5
  flutter_slidable: ^4.0.3
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  hive_ce_generator: ^1.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/ui/
    - assets/icons/habit/
    - assets/illustrations/
    - assets/brand/
    - assets/images/
    - assets/animations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
